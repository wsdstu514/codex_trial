<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ミニ・インベーダー</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>ミニ・インベーダー</h1>
    <div class="hud">
      <p>スコア: <span id="score">0</span></p>
      <p>残機: <span id="lives">3</span></p>
      <button id="restart">リスタート</button>
    </div>
    <canvas id="game" width="640" height="480" aria-label="インベーダーゲーム"></canvas>
    <p class="help">← → で移動 / スペースで発射</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
